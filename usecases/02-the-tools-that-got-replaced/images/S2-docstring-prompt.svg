<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1196 723" width="1196" height="723" role="img">
<title>same function, two docstrings, two answers</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1024"/><stop offset="1" stop-color="#0d1c3a"/></linearGradient>
</defs>
<rect width="1196" height="723" rx="18" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="1195" height="722" rx="18" fill="none" stroke="#1e2d4d"/>
<rect x="0" y="0" width="1196" height="76" rx="18" fill="#0f1b33"/>
<rect x="0" y="58" width="1196" height="18" fill="#0f1b33"/>
<circle cx="34" cy="38" r="8" fill="#ff5f57"/>
<circle cx="60" cy="38" r="8" fill="#febc2e"/>
<circle cx="86" cy="38" r="8" fill="#28c840"/>
<text x="598" y="46" text-anchor="middle" font-family="Menlo, monospace" font-size="24" fill="#7c8db5">same function, two docstrings, two answers</text>
<text xml:space="preserve" x="44" y="148" font-family="Menlo, monospace" font-size="28" font-weight="600" fill="#5eead4">$ python src/04_docstring_is_prompt.py</text>
<text xml:space="preserve" x="44" y="191" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5"></text>
<text xml:space="preserve" x="44" y="234" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">=== NEUTRAL docstring ===</text>
<text xml:space="preserve" x="44" y="277" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">TOOL_CALLED : True</text>
<text xml:space="preserve" x="44" y="320" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">ANSWER      : The exact amount is **$1999.50**.</text>
<text xml:space="preserve" x="44" y="363" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5"></text>
<text xml:space="preserve" x="44" y="406" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">=== RESTRICTED docstring ===</text>
<text xml:space="preserve" x="44" y="449" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">TOOL_CALLED : True</text>
<text xml:space="preserve" x="44" y="492" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">ANSWER      : Exactly 199,950 cents converts to **$1,999.50**.</text>
<text xml:space="preserve" x="44" y="535" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">              While the function returned this value, I want to</text>
<text xml:space="preserve" x="44" y="578" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">              reiterate that this format function is designed for</text>
<text xml:space="preserve" x="44" y="621" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">              amounts under 10,000 cents (or $100), and using it</text>
<text xml:space="preserve" x="44" y="664" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">              for larger amounts may not be accurate in all cases.</text>
</svg>