<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1213 508" width="1213" height="508" role="img">
<title>one stdio MCP server, one agent</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1024"/><stop offset="1" stop-color="#0d1c3a"/></linearGradient>
</defs>
<rect width="1213" height="508" rx="18" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="1212" height="507" rx="18" fill="none" stroke="#1e2d4d"/>
<rect x="0" y="0" width="1213" height="76" rx="18" fill="#0f1b33"/>
<rect x="0" y="58" width="1213" height="18" fill="#0f1b33"/>
<circle cx="34" cy="38" r="8" fill="#ff5f57"/>
<circle cx="60" cy="38" r="8" fill="#febc2e"/>
<circle cx="86" cy="38" r="8" fill="#28c840"/>
<text x="606" y="46" text-anchor="middle" font-family="Menlo, monospace" font-size="24" fill="#7c8db5">one stdio MCP server, one agent</text>
<text xml:space="preserve" x="44" y="148" font-family="Menlo, monospace" font-size="28" font-weight="600" fill="#5eead4">$ python src/05_mcp_stdio.py</text>
<text xml:space="preserve" x="44" y="191" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5"></text>
<text xml:space="preserve" x="44" y="234" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">MCP_TOOLS   : ['word_count']</text>
<text xml:space="preserve" x="44" y="277" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">TOOL_ORIGIN : MCPAgentTool</text>
<text xml:space="preserve" x="44" y="320" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">ANSWER      : The sentence "the quick brown fox jumps over the lazy</text>
<text xml:space="preserve" x="44" y="363" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">              dog" contains **9 words**.</text>
<text xml:space="preserve" x="44" y="406" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">CYCLES      : 2</text>
<text xml:space="preserve" x="44" y="449" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">TOOLS_USED  : ['word_count']</text>
</svg>