<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bgDark3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2547"/>
      <stop offset="1" stop-color="#14407c"/>
    </linearGradient>
    <marker id="covArr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7db4ff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bgDark3)"/>
  <circle cx="1520" cy="60" r="320" fill="#16407a"/>
  <circle cx="40" cy="880" r="260" fill="#103258"/>

  <!-- series tag -->
  <rect x="110" y="104" width="300" height="40" rx="20" fill="#1d4ed8"/>
  <text x="260" y="130" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">STRANDS IN ACTION · 03</text>

  <!-- title -->
  <text x="108" y="316" font-size="68" font-weight="800" fill="#ffffff">The Limits That</text>
  <text x="108" y="400" font-size="68" font-weight="800" fill="#7db4ff">Don't Limit</text>

  <!-- subtitle -->
  <text x="110" y="486" font-size="25" fill="#c3d6f2">Four walls to stop a runaway agent. Each one bounds</text>
  <text x="110" y="522" font-size="25" fill="#c3d6f2">something different from what its name promises.</text>

  <!-- footer -->
  <text x="110" y="796" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#8fb3e3">strands-agents 1.63.0 · every claim verified by running it</text>

  <!-- right visual: the cap that never sees the answer -->
  <rect x="950" y="160" width="470" height="200" rx="14" fill="#123a6b" stroke="#4f8ff7" stroke-width="2"/>
  <text x="985" y="200" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#ffffff">agent(prompt, limits={</text>
  <text x="985" y="232" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8fb3e3">  "turns": 3,</text>
  <text x="985" y="264" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8fb3e3">  "output_tokens": 80,</text>
  <text x="985" y="296" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#c3d6f2">})</text>
  <text x="985" y="334" font-size="13" fill="#5f83b8" font-family="ui-monospace, Menlo, monospace">the walls you set</text>

  <line x1="1185" y1="360" x2="1185" y2="452" stroke="#7db4ff" stroke-width="2.5" marker-end="url(#covArr3)"/>

  <rect x="950" y="460" width="225" height="96" rx="12" fill="#1a4a8f" stroke="#4f8ff7" stroke-width="2"/>
  <text x="1062" y="504" font-size="30" font-weight="700" fill="#9cc2ff" text-anchor="middle">80</text>
  <text x="1062" y="532" font-size="13.5" fill="#9cc2ff" text-anchor="middle">the token cap you set</text>

  <rect x="1195" y="460" width="255" height="96" rx="12" fill="#1a4a8f" stroke="#4f8ff7" stroke-width="2"/>
  <text x="1322" y="504" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">255</text>
  <text x="1322" y="532" font-size="13.5" fill="#9cc2ff" text-anchor="middle">what one answer spent</text>

  <!-- takeaway chip -->
  <rect x="950" y="616" width="470" height="92" rx="14" fill="#123a6b" stroke="#4f8ff7" stroke-width="2"/>
  <text x="1185" y="656" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">one turn later: stop_reason = end_turn</text>
  <text x="1185" y="686" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#8fb3e3" text-anchor="middle">the check never sees the answer</text>
</svg>
