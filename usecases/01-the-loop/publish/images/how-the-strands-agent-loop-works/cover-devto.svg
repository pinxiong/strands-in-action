<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 672" width="1600" height="672" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="covArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7db4ff"/>
    </marker>
  </defs>
  <defs><linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2547"/><stop offset="1" stop-color="#14407c"/></linearGradient></defs><rect width="1600" height="672" fill="url(#bgDark)"/>
  <circle cx="1560" cy="-40" r="280" fill="#16407a"/>
  <circle cx="30" cy="700" r="220" fill="#103258"/>

  <!-- series tag -->
  <rect x="110" y="76" width="280" height="36" rx="18" fill="#1d4ed8"/>
  <text x="250" y="100" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">STRANDS IN ACTION · 01</text>

  <!-- title -->
    <text x="108" y="230" font-size="62" font-weight="800" fill="#ffffff">How the Strands <tspan fill="#7db4ff">Agent Loop</tspan></text>
  <text x="108" y="310" font-size="62" font-weight="800" fill="#ffffff">Actually Works</text>

  <!-- subtitle -->
  <text x="110" y="392" font-size="23" fill="#c3d6f2">Reading the loop off the SDK source — recursion,</text>
  <text x="110" y="426" font-size="23" fill="#c3d6f2">thirteen stop reasons and the cost of a cycle.</text>

  <!-- footer -->
  <text x="110" y="600" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8fb3e3">strands-agents 1.63.0 · every line verified by running it</text>

  <g transform="translate(400, 40) scale(0.72)">
  <!-- right visual: nested cycles with recursion loop -->
  <rect x="950" y="200" width="500" height="330" rx="18" fill="#123a6b" stroke="#4f8ff7" stroke-width="3"/>
  <text x="990" y="252" font-size="24" font-weight="700" fill="#9cc2ff">cycle 1</text>

  <rect x="1030" y="286" width="340" height="170" rx="14" fill="#1a4a8f" stroke="#4f8ff7" stroke-width="2"/>
  <text x="1070" y="338" font-size="22" font-weight="700" fill="#bcd6ff">cycle 2</text>
  <text x="1070" y="378" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#c3d6f2">model &#8594; tool &#8594; model</text>
  <text x="1070" y="410" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8fb3e3">parent: cycle 1</text>

  <!-- recursion loop -->
  <polyline points="1370,371 1500,371 1500,160 1210,160 1210,194" fill="none" stroke="#7db4ff" stroke-width="3" stroke-dasharray="9,7" marker-end="url(#covArr)"/>
  <text x="1235" y="148" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#7db4ff">recurse_event_loop</text>

  <!-- takeaway chip -->
  <rect x="950" y="600" width="500" height="86" rx="14" fill="#123a6b" stroke="#4f8ff7" stroke-width="2"/>
  <text x="1200" y="640" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">The loop is not a loop.</text>
  <text x="1200" y="670" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8fb3e3" text-anchor="middle">turn count = stack depth</text>
  </g>
</svg>
