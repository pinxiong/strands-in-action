<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="990" viewBox="0 0 1440 990" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="990" fill="#ffffff"/>

  <text x="720" y="46" font-size="20" font-weight="600" fill="#111827" text-anchor="middle">Inside one cycle of the agent loop</text>
  <text x="720" y="72" font-size="13" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">every box carries its line in strands/event_loop/event_loop.py (1.63.0)</text>

  <!-- vertical spine -->
  <line x1="720" y1="152" x2="720" y2="178" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="720" y1="240" x2="720" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="720" y1="332" x2="720" y2="362" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="720" y1="424" x2="720" y2="454" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="720" y1="516" x2="720" y2="546" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 1. begins -->
  <rect x="490" y="90" width="460" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="720" y="114" font-size="15" fill="#111827" text-anchor="middle">Cycle N begins — it assigns its own id</text>
  <text x="720" y="136" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">event_loop.py:229</text>

  <!-- 2. decision: toolUse? -->
  <rect x="490" y="178" width="460" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="720" y="202" font-size="15" fill="#111827" text-anchor="middle">Does the newest message already carry a toolUse?</text>
  <text x="720" y="224" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">event_loop.py:271</text>
  <text x="726" y="262" font-size="13" fill="#2563eb">no</text>

  <!-- yes branch around the right side -->
  <polyline points="950,209 1360,209 1360,577 956,577" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrBlue)"/>
  <text x="1010" y="196" font-size="13" fill="#2563eb">yes — skip the model and adopt that message</text>

  <!-- 3. stream the model -->
  <rect x="490" y="270" width="460" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="720" y="294" font-size="15" fill="#111827" text-anchor="middle">Stream the model — a hook can deny the call outright</text>
  <text x="720" y="316" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">_handle_model_execution · event_loop.py:640–657</text>

  <!-- 4. keep two things -->
  <rect x="490" y="362" width="460" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="720" y="386" font-size="15" fill="#111827" text-anchor="middle">Keep two things: why it stopped and what it said</text>
  <text x="720" y="408" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">event_loop.py:293</text>

  <!-- 5. decision: stop_reason -->
  <rect x="490" y="454" width="460" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="720" y="478" font-size="15" fill="#111827" text-anchor="middle">Branch on stop_reason</text>
  <text x="720" y="500" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">event_loop.py:301–371</text>

  <!-- branch left: max_tokens -->
  <polyline points="490,485 285,485 285,542" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="305" y="475" font-size="13" fill="#64748b">max_tokens</text>
  <rect x="85" y="546" width="400" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="285" y="570" font-size="15" fill="#111827" text-anchor="middle">Raise MaxTokensReachedException</text>
  <text x="285" y="592" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">event_loop.py:301</text>

  <!-- branch center: tool_use -->
  <text x="728" y="538" font-size="13" fill="#2563eb">tool_use</text>
  <rect x="490" y="546" width="460" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="720" y="570" font-size="15" fill="#111827" text-anchor="middle">Run the tools, then this cycle is done</text>
  <text x="720" y="592" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">_handle_tool_execution · event_loop.py:312</text>

  <!-- branch right: other 12 -->
  <polyline points="950,485 1145,485 1145,542" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="960" y="475" font-size="13" fill="#64748b">any of the other 12</text>
  <rect x="960" y="546" width="370" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1145" y="570" font-size="15" fill="#111827" text-anchor="middle">Stop — control returns to your code</text>
  <text x="1145" y="592" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">EventLoopStopEvent · event_loop.py:371</text>

  <!-- tool sub-flow -->
  <line x1="720" y1="608" x2="720" y2="638" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="720" y1="700" x2="720" y2="730" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="720" y1="792" x2="720" y2="822" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="720" y1="884" x2="720" y2="914" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="490" y="638" width="460" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="720" y="662" font-size="15" fill="#111827" text-anchor="middle">Tool results become a user-role message</text>
  <text x="720" y="684" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">event_loop.py:1087</text>

  <rect x="490" y="730" width="460" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="720" y="754" font-size="15" fill="#111827" text-anchor="middle">Appended to the history the next cycle reads</text>
  <text x="720" y="776" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">event_loop.py:1135</text>

  <rect x="490" y="822" width="460" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="720" y="846" font-size="15" fill="#111827" text-anchor="middle">This cycle names itself the parent of the next</text>
  <text x="720" y="868" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">event_loop.py:1109</text>

  <rect x="490" y="914" width="460" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="720" y="938" font-size="15" fill="#111827" text-anchor="middle">recurse_event_loop — cycle N+1 begins</text>
  <text x="720" y="960" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">event_loop.py:1231</text>

  <!-- recursion loop-back -->
  <polyline points="950,945 1410,945 1410,121 956,121" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrBlue)"/>
  <text x="1080" y="108" font-size="13" fill="#2563eb">next cycle — one frame deeper on the Python stack</text>
</svg>
