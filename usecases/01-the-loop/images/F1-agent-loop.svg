<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" role="img">
<title>The agent loop as the spans describe it</title>
<desc>One invoke_agent span contains two event loop cycles. Cycle one calls chat then execute_tool calculator. Cycle two calls chat and the run ends.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="1400" height="860" fill="#ffffff"/>

<text x="70" y="64" font-family="sans-serif" font-size="34" font-weight="600" fill="#111827">The loop, as the spans describe it</text>
<text x="70" y="102" font-family="sans-serif" font-size="26" fill="#64748b">One call. Two cycles. The model decides how many.</text>

<rect x="500" y="150" width="400" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="700" y="186" font-family="sans-serif" font-size="30" font-weight="600" fill="#1e3a8a" text-anchor="middle">invoke_agent</text>
<text x="700" y="212" font-family="sans-serif" font-size="24" fill="#64748b" text-anchor="middle">one call, one span</text>

<path d="M700 224 L700 268" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="150" y="272" width="1100" height="176" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="176" y="308" font-family="sans-serif" font-size="28" font-weight="600" fill="#2563eb">cycle 1</text>

<rect x="180" y="326" width="1040" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="204" y="358" font-family="sans-serif" font-size="27" fill="#334155">chat &#8212; the model asks for a tool</text>

<rect x="180" y="386" width="1040" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="204" y="418" font-family="sans-serif" font-size="27" fill="#1e3a8a">execute_tool calculator &#8212; the tool runs</text>

<path d="M700 448 L700 492" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="150" y="496" width="1100" height="130" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="176" y="532" font-family="sans-serif" font-size="28" font-weight="600" fill="#2563eb">cycle 2 &#8212; parent_cycle_id: cycle 1</text>

<rect x="180" y="550" width="1040" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="204" y="582" font-family="sans-serif" font-size="27" fill="#334155">chat &#8212; the model reads the result and answers</text>

<path d="M700 626 L700 670" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="500" y="674" width="400" height="74" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="700" y="710" font-family="sans-serif" font-size="30" font-weight="600" fill="#166534" text-anchor="middle">end_turn</text>
<text x="700" y="736" font-family="sans-serif" font-size="24" fill="#64748b" text-anchor="middle">stop_reason</text>

<path d="M1250 561 L1320 561 L1320 360 L1250 360" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="1366" y="470" font-family="sans-serif" font-size="24" fill="#2563eb" text-anchor="middle" transform="rotate(-90 1366 470)">the model decides: another turn?</text>

<text x="70" y="810" font-family="sans-serif" font-size="24" fill="#94a3b8">Measured on strands-agents 1.63.0 with deepseek.v3.2 in us-east-1</text>
</svg>
