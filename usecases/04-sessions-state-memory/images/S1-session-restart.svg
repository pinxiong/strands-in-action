<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2204 1067" width="2204" height="1067" role="img">
<title>Two processes, one session id · FileSessionManager</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1024"/><stop offset="1" stop-color="#0d1c3a"/></linearGradient>
</defs>
<rect width="2204" height="1067" rx="18" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="2203" height="1066" rx="18" fill="none" stroke="#1e2d4d"/>
<rect x="0" y="0" width="2204" height="76" rx="18" fill="#0f1b33"/>
<rect x="0" y="58" width="2204" height="18" fill="#0f1b33"/>
