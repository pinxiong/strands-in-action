<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2238 637" width="2238" height="637" role="img">
<title>agent.state · JSON enforcement and restart</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1024"/><stop offset="1" stop-color="#0d1c3a"/></linearGradient>
</defs>
<rect width="2238" height="637" rx="18" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="2237" height="636" rx="18" fill="none" stroke="#1e2d4d"/>
<rect x="0" y="0" width="2238" height="76" rx="18" fill="#0f1b33"/>
<rect x="0" y="58" width="2238" height="18" fill="#0f1b33"/>
<circle cx="34" cy="38" r="8" fill="#ff5f57"/>
<circle cx="60" cy="38" r="8" fill="#febc2e"/>
<circle cx="86" cy="38" r="8" fill="#28c840"/>
<text x="120" y="46" text-anchor="start" font-family="Menlo, monospace" font-size="24" fill="#7c8db5">agent.state · JSON enforcement and restart</text>
<text xml:space="preserve" x="44" y="148" font-family="Menlo, monospace" font-size="28" font-weight="600" fill="#5eead4">$ python src/agent_state.py first &amp;&amp; python src/agent_state.py second</text>
<text xml:space="preserve" x="44" y="191" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5"></text>
<text xml:space="preserve" x="44" y="234" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">PHASE       : first</text>
<text xml:space="preserve" x="44" y="277" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">VISITS      : 1</text>
<text xml:space="preserve" x="44" y="320" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">USER        : {'name': 'Pin', 'plan': 'pro'}</text>
<text xml:space="preserve" x="44" y="363" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#fb7185">NON_JSON    : ValueError Value is not JSON serializable: object. Only JSON-compatible types (str, int, float, bool, list, dict,↵</text>
<text xml:space="preserve" x="44" y="406" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#fb7185">  None) are allowed</text>
<text xml:space="preserve" x="44" y="449" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">MSG_COUNT   : 2</text>
<text xml:space="preserve" x="44" y="492" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">PHASE       : second (fresh process, same session id)</text>
<text xml:space="preserve" x="44" y="535" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">VISITS      : 1</text>
<text xml:space="preserve" x="44" y="578" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">USER        : {'name': 'Pin', 'plan': 'pro'}</text>
</svg>