<text xml:space="preserve" x="44" y="406" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">TURN 4 filler  | msgs= 6 stored= 8 | OK. </text>
<text xml:space="preserve" x="44" y="449" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">TURN 5 filler  | msgs= 6 stored=10 | OK. </text>
<text xml:space="preserve" x="44" y="492" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">TURN 6 filler  | msgs= 6 stored=12 | OK. </text>
<text xml:space="preserve" x="44" y="535" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">TURN 7 ask     | msgs= 6 stored=14 | Sorry, I can't respond in a way that might provide private and sensitive information. This is↵</text>
