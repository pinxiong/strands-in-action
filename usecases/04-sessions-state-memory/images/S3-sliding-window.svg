<text xml:space="preserve" x="44" y="277" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">TURN 1 plant   | msgs= 2 stored= 2 | Acknowledged. </text>
<text xml:space="preserve" x="44" y="320" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">TURN 2 filler  | msgs= 4 stored= 4 | OK. </text>
