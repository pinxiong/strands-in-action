<text x="120" y="46" text-anchor="start" font-family="Menlo, monospace" font-size="24" fill="#7c8db5">requirements_check · 500 rps order API, no SLO/RTO/RPO declared</text>
<text xml:space="preserve" x="44" y="148" font-family="Menlo, monospace" font-size="28" font-weight="600" fill="#5eead4">$ curl -sX POST https://mcp.moretes.com/mcp -d @requirements_check.json</text>
<text xml:space="preserve" x="44" y="191" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">{</text>
<text xml:space="preserve" x="44" y="234" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  "kind": "heuristic-design-aid",</text>
<text xml:space="preserve" x="44" y="277" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  "validated": false,</text>
<text xml:space="preserve" x="44" y="320" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  "limitation": "Validate assumptions and current AWS documentation. This is not an official AWS review, security audit,↵</text>
<text xml:space="preserve" x="44" y="363" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  deployment or price quote.",</text>
<text xml:space="preserve" x="44" y="406" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  "requirements": [],</text>
<text xml:space="preserve" x="44" y="449" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  "constraints": [],</text>
<text xml:space="preserve" x="44" y="492" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  "decisionsToClarify": [</text>
<text xml:space="preserve" x="44" y="535" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">    "Business outcome and workload owner",</text>
<text xml:space="preserve" x="44" y="578" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">    "Data classification, residency and retention",</text>
<text xml:space="preserve" x="44" y="621" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">    "Traffic: normal/peak RPS, payloads and growth",</text>
<text xml:space="preserve" x="44" y="664" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">    "SLO, p95/p99 latency, RTO and RPO",</text>
<text xml:space="preserve" x="44" y="707" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">    "Authentication, authorization and tenancy",</text>
<text xml:space="preserve" x="44" y="750" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">    "Monthly budget, currency and pricing region",</text>
<text xml:space="preserve" x="44" y="793" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">    "Team skills, dependencies and migration constraints"</text>
<text xml:space="preserve" x="44" y="836" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  ],</text>
<text xml:space="preserve" x="44" y="879" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  "nextTools": ["architecture_pattern", "aws_knowledge_search", "decision_record"]</text>
<text xml:space="preserve" x="44" y="922" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">}</text>
<text xml:space="preserve" x="44" y="965" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5"># brief: order API, 500 rps peak, budget / SLO / RTO / RPO undefined</text>
<text xml:space="preserve" x="44" y="1008" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5"># result: requirements [] and constraints [] stay empty. no invented SLO.</text>
<text xml:space="preserve" x="44" y="1051" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5"># the gap stayed a gap, and it came back as seven questions, not seven answers.</text>
</svg>