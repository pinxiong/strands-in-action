<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1482 1024" width="1482" height="1024" role="img">
<title>capacity_plan · the schema asks the client to invent what the brief lacks</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1024"/><stop offset="1" stop-color="#0d1c3a"/></linearGradient>
</defs>
<rect width="1482" height="1024" rx="18" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="1481" height="1023" rx="18" fill="none" stroke="#1e2d4d"/>
<rect x="0" y="0" width="1482" height="76" rx="18" fill="#0f1b33"/>
<rect x="0" y="58" width="1482" height="18" fill="#0f1b33"/>
<circle cx="34" cy="38" r="8" fill="#ff5f57"/>
<circle cx="60" cy="38" r="8" fill="#febc2e"/>
<circle cx="86" cy="38" r="8" fill="#28c840"/>
<text x="120" y="46" text-anchor="start" font-family="Menlo, monospace" font-size="24" fill="#7c8db5">capacity_plan · the schema asks the client to invent what the brief lacks</text>
<text xml:space="preserve" x="44" y="148" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5"># step 4: capacity for 500 rps. the brief has no latency and no payload size.</text>
<text xml:space="preserve" x="44" y="191" font-family="Menlo, monospace" font-size="28" font-weight="600" fill="#5eead4">$ curl -sX POST $MCP -d '{"requestsPerSecond":500}'</text>
<text xml:space="preserve" x="44" y="234" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#fb7185">Invalid tool input: durationMs: Invalid input: expected number, received undefined;</text>
<text xml:space="preserve" x="44" y="277" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#fb7185">payloadKB: Invalid input: expected number, received undefined</text>
<text xml:space="preserve" x="44" y="320" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#fb7185">isError: true</text>
<text xml:space="preserve" x="44" y="363" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5"></text>
<text xml:space="preserve" x="44" y="406" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5"># so the client fills them. 250 ms and 4 KB are mine, not the team's.</text>
<text xml:space="preserve" x="44" y="449" font-family="Menlo, monospace" font-size="28" font-weight="600" fill="#5eead4">$ curl -sX POST $MCP -d '{"requestsPerSecond":500,"durationMs":250,</text>
<text xml:space="preserve" x="44" y="492" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  "payloadKB":4,"headroom":1.3}'</text>
<text xml:space="preserve" x="44" y="535" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">{</text>
<text xml:space="preserve" x="44" y="578" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  "kind": "calculation",</text>
<text xml:space="preserve" x="44" y="621" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  "assumptions": {"requestsPerSecond": 500, "durationMs": 250,</text>
<text xml:space="preserve" x="44" y="664" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">                  "payloadKB": 4, "headroom": 1.3},</text>
<text xml:space="preserve" x="44" y="707" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  "averageConcurrency": 125,</text>
<text xml:space="preserve" x="44" y="750" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  "plannedConcurrency": 163,</text>
<text xml:space="preserve" x="44" y="793" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  "dailyRequests": 43200000,</text>
<text xml:space="preserve" x="44" y="836" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">  "dailyPayloadGB": 172.8</text>
<text xml:space="preserve" x="44" y="879" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5">}</text>
<text xml:space="preserve" x="44" y="922" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5"># 500 came from the caller. 250, 4 and 1.3 came from the model.</text>
<text xml:space="preserve" x="44" y="965" font-family="Menlo, monospace" font-size="28" font-weight="400" fill="#dfe7f5"># one object, one label, four values, two different origins.</text>
</svg>